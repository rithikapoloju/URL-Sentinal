<!DOCTYPE html>
<html>
<head>
    <title>URL Sentinel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            width: 300px;
            padding: 10px;
            text-align: center;
        }
        h3 { margin-top: 0; color: #333; }
        input[type="text"] { width: 90%; padding: 5px; margin-bottom: 10px; border: 1px solid #ccc; }
        button { padding: 5px 10px; cursor: pointer; }
        .result-box { padding: 8px; border-radius: 4px; margin-top: 10px; }
        .malicious { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .legitimate { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .checking { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        #blockButton { background-color: #dc3545; color: white; border: none; padding: 8px 15px; margin-top: 10px; display: none; }
        #currentUrlDisplay { font-size: 0.9em; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h3>URL Sentinel</h3>
    <p>Paste or type URL for safe check:</p>
    <input type="text" id="urlInput" placeholder="Enter URL here">
    <button id="checkButton">Check</button>
    
    <div id="statusBox" class="result-box checking">
        Enter URL and click Check.
    </div>
    
    <button id="blockButton" style="display:none;">Block URL</button>
    
    <script src="popup.js"></script>
</body>
</html>
